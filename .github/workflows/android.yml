name: Android CI

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: Amethyst-Android/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Build JRE JAR files
        run: |
          cd Amethyst-Android
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Decode keystore
        env:
          LINUX8081_KEYSTORE: ${{ secrets.LINUX8081_KEYSTORE }}
        run: |
          echo "$LINUX8081_KEYSTORE" | base64 -d > ./Amethyst-Android/app_pojavlauncher/aamc_upload.jks

      - name: Patch files
        run: |
          patch ./Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/tasks/MinecraftDownloader.java MinecraftDownloader.patch
          patch ./Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/Tools.java Tools.patch

      - name: Build Release .apk
        env:
          GPLAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd Amethyst-Android
          # Build the launcher
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen md5sum
        run: |
          cd Amethyst-Android
          md5sum out/app-release.apk > out/app-release.md5

      - name: Build Debug .apk
        run: |
          cd Amethyst-Android
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sum
        run: |
          cd Amethyst-Android
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Amethyst-Android/out/app-debug.*

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Amethyst-Android/out/app-release.*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-${{ github.run_id }}
          files: |
            Amethyst-Android/out/app-release.apk
            Amethyst-Android/out/app-release.md5
            Amethyst-Android/out/app-debug.apk
            Amethyst-Android/out/app-debug.md5
